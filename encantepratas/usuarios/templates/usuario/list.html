{% extends 'base.html' %}
{% block content %}
<h1>Usuários</h1>
<a href="{% url 'usuario_create' %}">+ Novo usuário</a>
<ul>
{% for usuario in usuarios %}
    <li><a href="{% url 'usuario_detail' usuario.pk %}">{{ usuario.user.username }}</a> — {{ usuario.cidade }}</li>
{% empty %}
    <li>Nenhum usuário cadastrado.</li>
{% endfor %}
</ul>
{% endblock %}
