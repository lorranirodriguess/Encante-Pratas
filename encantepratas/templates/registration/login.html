{% extends 'base.html' %}
{% block content %}
<h1>Entrar</h1>
<form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <p><label>Usuário: <input type="text" name="username" required></label></p>
    <p><label>Senha: <input type="password" name="password" required></label></p>
    <button type="submit">Entrar</button>
</form>
{% endblock %}
