{% extends 'base.html' %}
{% block title %}{{ titulo }} — Encante Pratas{% endblock %}
{% block content %}
<section class="page-header">
  <div class="container"><h1 class="h3 fw-bold mb-0">{{ titulo }}</h1></div>
</section>
<section class="section-space">
  <div class="container">
    {% if form.non_field_errors %}
      <div class="alert alert-danger" style="max-width: 42rem;">{{ form.non_field_errors }}</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-bloom">Salvar</button>
        <a class="btn btn-outline-secondary" href="{% url 'pagamento_list' %}">Cancelar</a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
