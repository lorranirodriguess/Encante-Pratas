{% extends 'base.html' %}
{% block content %}
<section class="section-space"><div class="container">
<h1>Excluir categoria "{{ categoria.nome }}"?</h1>
<form method="post">
    {% csrf_token %}
    <button type="submit">Confirmar exclusão</button>
</form>
<a href="{% url 'categoria_detail' categoria.pk %}">Cancelar</a>
</div></section>
{% endblock %}
