{% extends 'base.html' %}
{% block content %}
<h1>{{ categoria.nome }}</h1>
<p>{{ categoria.descricao }}</p>
<p>Status: {% if categoria.ativo %}Ativa{% else %}Inativa{% endif %}</p>

<a href="{% url 'categoria_update' categoria.pk %}">Editar</a> |
<a href="{% url 'categoria_delete' categoria.pk %}">Excluir</a> |
<a href="{% url 'categoria_list' %}">Voltar</a>
{% endblock %}
