{% extends 'base.html' %}
{% block content %}
<section class="section-space"><div class="container">
<h1>Excluir produto "{{ produto.nome }}"?</h1>
<form method="post">
    {% csrf_token %}
    <button type="submit">Confirmar exclusão</button>
</form>
<a href="{% url 'produto_detail' produto.pk %}">Cancelar</a>
</div></section>
{% endblock %}
